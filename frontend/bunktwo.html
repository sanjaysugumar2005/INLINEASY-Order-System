<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>INLINEASY | Vehicle Details</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            font-family:
                "Posterama1919",
                Arial,
                sans-serif;

            background: #FFFFFF;

            color: #000000;

            min-height: 100vh;

            padding: 25px 15px 50px;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 480px;

            background: #FFFFFF;

            border: 1px solid #DADADA;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.08);

        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            font-size: 25px;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }


        .logo span {

            color: #00FF42;

        }


        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {

            text-align: center;

            margin-bottom: 28px;

        }


        .page-title h1 {

            font-size: 30px;

            letter-spacing: -0.5px;

        }


        .page-title p {

            color: #777777;

            font-size: 13px;

            margin-top: 7px;

        }


        /* =========================
           STATUS BOX
        ========================= */

        .status-box {

            border: 1px solid #000000;

            border-radius: 14px;

            padding: 17px;

            margin-bottom: 25px;

            background: #FFFFFF;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.05);

        }


        .status-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 9px;

        }


        .status-title {

            font-size: 11px;

            color: #777777;

            font-weight: 700;

            text-transform:
                uppercase;

            letter-spacing: 0.5px;

        }


        .status {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #000000;

            font-size: 15px;

            font-weight: 800;

        }


        .status-dot {

            width: 9px;

            height: 9px;

            background: #00FF42;

            border-radius: 50%;

            box-shadow:
                0 0 0 4px
                rgba(0, 255, 66, 0.13);

        }


        .status-line {

            height: 3px;

            width: 100%;

            background: #00FF42;

            border-radius: 5px;

        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {

            text-align: center;

            font-size: 13px;

            color: #666666;

            margin-bottom: 25px;

        }


        .welcome strong {

            color: #000000;

        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-size: 12px;

            font-weight: 800;

            margin-bottom: 8px;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 15px;

        }


        input {

            width: 100%;

            height: 50px;

            padding: 10px 13px 10px 42px;

            border: 1px solid #CFCFCF;

            border-radius: 11px;

            background: #FFFFFF;

            color: #000000;

            font-family: inherit;

            font-size: 13px;

            outline: none;

            transition: 0.2s;

            text-transform: uppercase;

        }


        input::placeholder {

            color: #A5A5A5;

            text-transform: none;

        }


        input:focus {

            border-color: #000000;

            box-shadow:
                0 0 0 3px
                rgba(0, 255, 66, 0.15);

        }


        .car-example {

            font-size: 10px;

            color: #999999;

            margin-top: 7px;

        }


        /* =========================
           CONTINUE BUTTON
        ========================= */

        button {

            width: 100%;

            height: 52px;

            border: 1px solid #000000;

            border-radius: 11px;

            background: #00FF42;

            color: #000000;

            font-family: inherit;

            font-size: 13px;

            font-weight: 900;

            letter-spacing: 0.4px;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 22px
                rgba(0, 0, 0, 0.12);

        }


        button:active {

            transform:
                translateY(0);

        }


        /* =========================
           ERROR
        ========================= */

        .error {

            color: #D00000;

            font-size: 12px;

            text-align: center;

            margin-top: 13px;

            display: none;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #999999;

            font-size: 10px;

        }


        .footer strong {

            color: #000000;

        }


        .footer span {

            color: #00FF42;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {

            body {

                padding:
                    20px 12px;

                align-items:
                    flex-start;

            }


            .container {

                margin-top: 20px;

                padding:
                    28px 20px;

                border-radius:
                    18px;

            }


            .logo {

                font-size: 22px;

            }


            .page-title h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             LOGO
        ========================== -->

        <div class="logo">

            INLIN<span>E</span>ASY

        </div>


        <!-- =========================
             TITLE
        ========================== -->

        <div class="page-title">

            <h1>
                Vehicle Details
            </h1>

            <p>
                Enter your vehicle information
                to continue your booking.
            </p>

        </div>


        <!-- =========================
             BUNK STATUS
        ========================== -->

        <div class="status-box">


            <div class="status-top">


                <div class="status-title">

                    CNG Station Status

                </div>


                <div class="status">

                    <div class="status-dot"></div>

                    OPEN

                </div>


            </div>


            <div class="status-line"></div>


        </div>


        <!-- =========================
             USER
        ========================== -->

        <p class="welcome">

            Welcome,

            <strong id="displayUserName">
                User
            </strong>

        </p>


        <!-- =========================
             CAR NUMBER
        ========================== -->

        <div class="form-group">


            <label for="carNumber">

                VEHICLE REGISTRATION NUMBER

            </label>


            <div class="input-wrapper">


                <div class="input-icon">
                    🚗
                </div>


                <input
                    type="text"
                    id="carNumber"
                    placeholder="TN31NS1234"
                    maxlength="10"
                    autocomplete="off"
                >


            </div>


            <p class="car-example">

                Example: TN31NS1234

            </p>


        </div>



        <!-- =========================
             CAR MODEL
        ========================== -->

        <div class="form-group">


            <label for="carModel">

                VEHICLE MODEL

            </label>


            <div class="input-wrapper">


                <div class="input-icon">
                    ◆
                </div>


                <input
                    type="text"
                    id="carModel"
                    placeholder="Enter car model"
                    maxlength="40"
                    autocomplete="off"
                >


            </div>


        </div>



        <!-- =========================
             CONTINUE
        ========================== -->

        <button
            onclick="continueToBooking()">

            CONTINUE TO SLOT BOOKING

        </button>


        <!-- =========================
             ERROR
        ========================== -->

        <p
            id="errorMessage"
            class="error">
        </p>



        <!-- =========================
             FOOTER
        ========================== -->

        <div class="footer">

            <strong>
                INLIN<span>E</span>ASY
            </strong>

            &nbsp;•&nbsp;

            Smart Slot Booking

        </div>


    </div>



    <!--
        HTML is inside frontend/
        JavaScript is inside js/

        Therefore:
        ../js/bunktwo.js
    -->

    <script src="../js/bunktwo.js"></script>


</body>

</html>
