<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>INLINEASY | Vehicle Details</title>
    <link rel="stylesheet" href="../css/style.css">



</head>


<body>


    <div class="container">


        <!-- =========================
             LOGO
        ========================== -->

        <div class="logo">

            INLIN<span>E</span>ASY

        </div>

        <!-- =========================
             BUNK STATUS
        ========================== -->

        <div class="status-box">


            <div class="status-top">


                <div class="status-title">

                    CNG Station Status

                </div>


                <div class="status">

                    <div class="status-dot"></div>

                    OPEN

                </div>


            </div>


            <div class="status-line"></div>


        </div>


        <!-- =========================
             USER
        ========================== -->

        <p class="welcome">

            Welcome,

            <strong id="displayUserName">
                User
            </strong>

        </p>


        <!-- =========================
             CAR NUMBER
        ========================== -->

        <div class="form-group">


            <label for="carNumber">

                VEHICLE REGISTRATION NUMBER

            </label>


            <div class="input-wrapper">


                <div class="input-icon">
                    🚗
                </div>


                <input
                    type="text"
                    id="carNumber"
                    placeholder="TN31NS1234"
                    maxlength="10"
                    autocomplete="off"
                >


            </div>


            <p class="car-example">

                Example: TN31NS1234

            </p>


        </div>



        <!-- =========================
             CAR MODEL
        ========================== -->

        <div class="form-group">


            <label for="carModel">

                VEHICLE MODEL

            </label>


            <div class="input-wrapper">


                <div class="input-icon">
                    ◆
                </div>


                <input
                    type="text"
                    id="carModel"
                    placeholder="Enter car model"
                    maxlength="40"
                    autocomplete="off"
                >


            </div>


        </div>



        <!-- =========================
             CONTINUE
        ========================== -->

        <button
            onclick="continueToBooking()">

            CONTINUE TO SLOT BOOKING

        </button>


        <!-- =========================
             ERROR
        ========================== -->

        <p
            id="errorMessage"
            class="error">
        </p>



        <!-- =========================
             FOOTER
        ========================== -->

        <div class="footer">

            <strong>
                INLIN<span>E</span>ASY
            </strong>

            &nbsp;•&nbsp;

            Smart Slot Booking

        </div>


    </div>



    <!--
        HTML is inside frontend/
        JavaScript is inside js/

        Therefore:
        ../js/bunktwo.js
    -->

    <script src="../js/bunktwo.js"></script>


</body>

</html>
