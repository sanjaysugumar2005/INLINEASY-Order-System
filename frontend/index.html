<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>INLINEASY | Smart Slot Booking</title>

    <link rel="stylesheet" href="../css/style.css">
<style>
/* =========================================
   INLINEASY — PREMIUM LOGIN
   BLACK / WHITE / NEON GREEN
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Posterama1919", Arial, sans-serif;
    background: #050505;
    color: #ffffff;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 24px 16px;
}

/* MAIN CARD */

.container {
    width: 100%;
    max-width: 460px;

    background: #0b0b0b;

    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;

    padding: 42px 38px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.65),
        0 0 40px rgba(0, 255, 66, 0.04);

    position: relative;
    overflow: hidden;
}

/* GREEN TOP LINE */

.container::before {
    content: "";

    position: absolute;
    top: 0;
    left: 10%;
    width: 80%;
    height: 2px;

    background: #00FF42;

    box-shadow:
        0 0 15px rgba(0, 255, 66, 0.8),
        0 0 35px rgba(0, 255, 66, 0.25);
}

/* LOGO */

.logo {
    text-align: center;

    font-size: 30px;
    font-weight: 900;

    letter-spacing: 1.5px;

    margin-bottom: 38px;

    color: #ffffff;
}

.logo span {
    color: #00FF42;

    text-shadow:
        0 0 12px rgba(0, 255, 66, 0.7);
}

/* WELCOME */

.welcome {
    text-align: center;

    margin-bottom: 9px;

    color: #777777;

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 2px;
}

/* TITLE */

h1 {
    text-align: center;

    color: #ffffff;

    font-size: 31px;
    line-height: 1.15;

    letter-spacing: -0.7px;

    margin-bottom: 10px;
}

/* TAGLINE */

.tagline {
    text-align: center;

    color: #8d8d8d;

    font-size: 13px;

    margin-bottom: 34px;
}

.tagline span {
    color: #00FF42;

    font-weight: 900;

    text-shadow:
        0 0 10px rgba(0, 255, 66, 0.6);
}

/* FORM */

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;

    color: #d0d0d0;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 1px;

    margin-bottom: 8px;
}

/* INPUT WRAPPER */

.input-wrapper {
    position: relative;
}

/* ICON */

.input-icon {
    position: absolute;

    left: 14px;
    top: 50%;

    transform: translateY(-50%);

    color: #777777;

    font-size: 14px;

    z-index: 2;
}

/* INPUT */

input {
    width: 100%;
    height: 53px;

    padding:
        10px 13px 10px 42px;

    border: 1px solid rgba(255, 255, 255, 0.10);

    border-radius: 12px;

    background: #111111;

    color: #ffffff;

    font-family: inherit;
    font-size: 13px;

    outline: none;

    transition: 0.25s ease;
}

input::placeholder {
    color: #666666;
}

input:hover {
    border-color: rgba(255, 255, 255, 0.18);
}

input:focus {
    border-color: #00FF42;

    box-shadow:
        0 0 0 3px rgba(0, 255, 66, 0.10),
        0 0 20px rgba(0, 255, 66, 0.08);
}

/* BUTTON */

button {
    width: 100%;
    height: 53px;

    margin-top: 4px;

    border: none;

    border-radius: 12px;

    background: #00FF42;

    color: #000000;

    font-family: inherit;

    font-size: 13px;
    font-weight: 900;

    letter-spacing: 0.8px;

    cursor: pointer;

    transition: 0.25s ease;

    box-shadow:
        0 0 0 rgba(0, 255, 66, 0);
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 30px rgba(0, 255, 66, 0.20),
        0 0 25px rgba(0, 255, 66, 0.12);
}

button:active {
    transform: translateY(0);
}

/* ERROR */

.error {
    color: #ff4d4d;

    font-size: 12px;

    text-align: center;

    margin-top: 14px;

    display: none;
}

/* SECURITY */

.secure-note {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 7px;

    color: #666666;

    font-size: 10px;

    margin-top: 25px;
}

.secure-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #00FF42;

    box-shadow:
        0 0 8px rgba(0, 255, 66, 0.7);
}

/* FOOTER */

.footer {
    text-align: center;

    margin-top: 22px;
    padding-top: 18px;

    border-top: 1px solid rgba(255, 255, 255, 0.07);

    color: #666666;

    font-size: 9px;
}

.footer strong {
    color: #ffffff;
}

.footer span {
    color: #00FF42;
}

/* MOBILE */

@media (max-width: 520px) {

    body {
        padding: 18px 12px;
    }

    .container {
        padding: 32px 22px;

        border-radius: 20px;
    }

    .logo {
        font-size: 25px;

        margin-bottom: 30px;
    }

    h1 {
        font-size: 27px;
    }
}
</style>


</head>


<body>


    <div class="container">


        <!-- =========================
             LOGO
        ========================== -->

        <div class="logo">

            INLIN<span>E</span>ASY

        </div>


        <!-- =========================
             TITLE
        ========================== -->

        <p class="welcome">

            Welcome To

        </p>


        <h1>

            Smart Slot Booking

        </h1>


        <p class="tagline">

            Your Time, Your Fuel
            <span>•</span>

        </p>



        <!-- =========================
             USERNAME
        ========================== -->

        <div class="form-group">


            <label for="userName">

                YOUR NAME

            </label>


            <div class="input-wrapper">

                <div class="input-icon">
                    👤
                </div>


                <input
                    type="text"
                    id="userName"
                    placeholder="Enter your name"
                    maxlength="30"
                    autocomplete="name"
                >

            </div>


        </div>



        <!-- =========================
             PHONE
        ========================== -->

        <div class="form-group">


            <label for="phoneNumber">

                PHONE NUMBER

            </label>


            <div class="input-wrapper">

                <div class="input-icon">
                    📱
                </div>


                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                >

            </div>


        </div>



        <!-- =========================
             ENTER
        ========================== -->

        <button
            onclick="continueToBunk()">

            CONTINUE

        </button>


        <!-- =========================
             ERROR
        ========================== -->

        <p
            id="errorMessage"
            class="error">
        </p>



        <!-- =========================
             SECURITY
        ========================== -->

        <div class="secure-note">

            <div class="secure-dot"></div>

            Your booking information is securely stored

        </div>



        <!-- =========================
             FOOTER
        ========================== -->

        <div class="footer">

            <strong>
                INLIN<span>E</span>ASY
            </strong>

            &nbsp;•&nbsp;

            Smart Mobility Platform

        </div>


    </div>



    <!--
        index.html
        is inside frontend/

        script.js
        is inside js/

        Therefore:
        ../js/script.js
    -->

    <script src="../js/script.js"></script>


</body>

</html>
