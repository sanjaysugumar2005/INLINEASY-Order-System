<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>INLINEASY | Smart Slot Booking</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                "Posterama1919",
                Arial,
                sans-serif;

            background: #FFFFFF;

            color: #000000;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px 15px;

        }


        /* =========================
           MAIN
        ========================== */

        .container {

            width: 100%;

            max-width: 460px;

            background: #FFFFFF;

            border: 1px solid #D8D8D8;

            border-radius: 22px;

            padding: 42px 38px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.08);

        }


        /* =========================
           LOGO
        ========================== */

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 900;

            letter-spacing: 1.2px;

            margin-bottom: 35px;

        }


        .logo span {

            color: #00FF42;

        }


        /* =========================
           WELCOME
        ========================== */

        .welcome {

            text-align: center;

            margin-bottom: 8px;

            color: #777777;

            font-size: 12px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 1px;

        }


        h1 {

            text-align: center;

            font-size: 31px;

            line-height: 1.15;

            letter-spacing: -0.5px;

            margin-bottom: 10px;

        }


        .tagline {

            text-align: center;

            color: #666666;

            font-size: 13px;

            margin-bottom: 32px;

        }


        .tagline span {

            color: #00B832;

            font-weight: 700;

        }


        /* =========================
           FORM
        ========================== */

        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.4px;

            margin-bottom: 8px;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #777777;

            font-size: 14px;

        }


        input {

            width: 100%;

            height: 51px;

            padding:
                10px 13px 10px 40px;

            border: 1px solid #D0D0D0;

            border-radius: 11px;

            background: #FFFFFF;

            color: #000000;

            font-family: inherit;

            font-size: 13px;

            outline: none;

            transition: 0.2s;

        }


        input::placeholder {

            color: #A5A5A5;

        }


        input:focus {

            border-color: #000000;

            box-shadow:
                0 0 0 3px
                rgba(0, 255, 66, 0.16);

        }


        /* =========================
           ENTER BUTTON
        ========================== */

        button {

            width: 100%;

            height: 53px;

            margin-top: 4px;

            border: 1px solid #000000;

            border-radius: 11px;

            background: #00FF42;

            color: #000000;

            font-family: inherit;

            font-size: 13px;

            font-weight: 900;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 9px 24px
                rgba(0, 0, 0, 0.12);

        }


        button:active {

            transform:
                translateY(0);

        }


        /* =========================
           ERROR
        ========================== */

        .error {

            color: #D00000;

            font-size: 12px;

            text-align: center;

            margin-top: 14px;

            display: none;

        }


        /* =========================
           SECURITY NOTE
        ========================== */

        .secure-note {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 6px;

            color: #999999;

            font-size: 10px;

            margin-top: 25px;

        }


        .secure-dot {

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background: #00FF42;

        }


        /* =========================
           FOOTER
        ========================== */

        .footer {

            text-align: center;

            margin-top: 22px;

            padding-top: 18px;

            border-top: 1px solid #EEEEEE;

            color: #999999;

            font-size: 9px;

        }


        .footer strong {

            color: #000000;

        }


        .footer span {

            color: #00FF42;

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 520px) {

            body {

                padding:
                    18px 12px;

                align-items:
                    center;

            }


            .container {

                padding:
                    32px 22px;

                border-radius:
                    18px;

            }


            .logo {

                font-size: 25px;

                margin-bottom:
                    28px;

            }


            h1 {

                font-size:
                    27px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             LOGO
        ========================== -->

        <div class="logo">

            INLIN<span>E</span>ASY

        </div>


        <!-- =========================
             TITLE
        ========================== -->

        <p class="welcome">

            Welcome To

        </p>


        <h1>

            Smart Slot Booking

        </h1>


        <p class="tagline">

            Your Time, Your Fuel
            <span>•</span>

        </p>



        <!-- =========================
             USERNAME
        ========================== -->

        <div class="form-group">


            <label for="userName">

                YOUR NAME

            </label>


            <div class="input-wrapper">

                <div class="input-icon">
                    👤
                </div>


                <input
                    type="text"
                    id="userName"
                    placeholder="Enter your name"
                    maxlength="30"
                    autocomplete="name"
                >

            </div>


        </div>



        <!-- =========================
             PHONE
        ========================== -->

        <div class="form-group">


            <label for="phoneNumber">

                PHONE NUMBER

            </label>


            <div class="input-wrapper">

                <div class="input-icon">
                    📱
                </div>


                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                >

            </div>


        </div>



        <!-- =========================
             ENTER
        ========================== -->

        <button
            onclick="continueToBunk()">

            CONTINUE

        </button>


        <!-- =========================
             ERROR
        ========================== -->

        <p
            id="errorMessage"
            class="error">
        </p>



        <!-- =========================
             SECURITY
        ========================== -->

        <div class="secure-note">

            <div class="secure-dot"></div>

            Your booking information is securely stored

        </div>



        <!-- =========================
             FOOTER
        ========================== -->

        <div class="footer">

            <strong>
                INLIN<span>E</span>ASY
            </strong>

            &nbsp;•&nbsp;

            Smart Mobility Platform

        </div>


    </div>



    <!--
        index.html
        is inside frontend/

        script.js
        is inside js/

        Therefore:
        ../js/script.js
    -->

    <script src="../js/script.js"></script>


</body>

</html>
