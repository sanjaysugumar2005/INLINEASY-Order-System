<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INLINEASY - Ticket</title>

    <style>

/* =========================================
   INLINEASY — PREMIUM TICKET
   BLACK / WHITE / NEON GREEN
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Posterama1919", Arial, sans-serif;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            rgba(0, 255, 66, 0.08),
            transparent 35%
        ),
        #050505;

    color: #ffffff;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 35px 16px 60px;
}

/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    width: 100%;
    max-width: 520px;
}

/* =========================================
   LOGO
========================================= */

.logo {
    text-align: center;

    font-size: 30px;
    font-weight: 900;

    letter-spacing: 2px;

    margin-bottom: 28px;

    color: #ffffff;
}

.logo span {
    color: #00FF42;

    text-shadow:
        0 0 12px rgba(0, 255, 66, 0.7);
}

/* =========================================
   TICKET
========================================= */

.ticket {
    position: relative;

    background: #0b0b0b;

    border: 1px solid rgba(255, 255, 255, 0.10);

    border-radius: 24px;

    padding: 30px;

    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.65),
        0 0 45px rgba(0, 255, 66, 0.05);
}

/* GREEN TOP LINE */

.ticket::before {
    content: "";

    position: absolute;

    top: 0;
    left: 8%;

    width: 84%;
    height: 2px;

    background: #00FF42;

    box-shadow:
        0 0 15px rgba(0, 255, 66, 0.8),
        0 0 35px rgba(0, 255, 66, 0.25);
}

/* =========================================
   TITLE
========================================= */

.title {
    text-align: center;

    font-size: 23px;
    font-weight: 900;

    letter-spacing: 0.5px;

    color: #ffffff;
}

.confirmed {
    text-align: center;

    margin-top: 9px;
    margin-bottom: 26px;

    color: #00FF42;

    font-size: 11px;
    font-weight: 900;

    letter-spacing: 1.5px;
}

/* =========================================
   TOKEN
========================================= */

.token-box {
    background: #050505;

    border: 1px solid rgba(0, 255, 66, 0.25);

    border-radius: 18px;

    padding: 23px;

    text-align: center;

    margin-bottom: 25px;

    box-shadow:
        inset 0 0 25px rgba(0, 255, 66, 0.03);
}

.token-label {
    color: #00FF42;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 3px;
}

.token {
    margin-top: 6px;

    color: #ffffff;

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 2px;

    text-shadow:
        0 0 18px rgba(0, 255, 66, 0.18);
}

/* =========================================
   DETAILS
========================================= */

.details {
    display: flex;

    flex-direction: column;

    gap: 0;
}

.row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    min-height: 46px;

    padding: 10px 0;

    border-bottom: 1px solid
        rgba(255, 255, 255, 0.07);
}

.label {
    color: #777777;

    font-size: 10px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 0.8px;
}

.value {
    color: #ffffff;

    font-size: 12px;

    font-weight: 800;

    text-align: right;

    word-break: break-word;
}

/* =========================================
   QR SECTION
========================================= */

.qr-section {
    margin-top: 26px;

    padding-top: 25px;

    border-top: 1px dashed
        rgba(255, 255, 255, 0.20);

    text-align: center;
}

.qr-section h3 {
    color: #ffffff;

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 1.5px;
}

#qrcode {
    display: flex;

    justify-content: center;
    align-items: center;

    margin: 20px auto;

    width: 190px;
    height: 190px;

    padding: 12px;

    background: #ffffff;

    border-radius: 14px;

    box-shadow:
        0 0 0 1px rgba(255,255,255,0.15),
        0 12px 30px rgba(0,0,0,0.35);
}

#qrcode img,
#qrcode canvas {
    max-width: 100%;
    height: auto;
}

.qr-note {
    color: #777777;

    font-size: 10px;

    line-height: 1.5;
}

/* =========================================
   WARNING
========================================= */

.warning {
    margin-top: 22px;

    padding: 15px;

    border: 1px solid
        rgba(255, 255, 255, 0.10);

    border-radius: 13px;

    background: #111111;

    color: #777777;

    font-size: 10px;

    line-height: 1.6;

    text-align: center;
}

.warning strong {
    color: #ffffff;

    font-weight: 800;
}

/* =========================================
   DOWNLOAD BUTTON
========================================= */

.download-btn {
    width: 100%;

    height: 52px;

    margin-top: 20px;

    border: 1px solid #00FF42;

    border-radius: 12px;

    background: #00FF42;

    color: #000000;

    font-family: inherit;

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 0.8px;

    cursor: pointer;

    transition: 0.25s ease;
}

.download-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 30px rgba(0, 255, 66, 0.20);
}

.download-btn:active {
    transform: translateY(0);
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 520px) {

    body {
        padding: 20px 12px 40px;
    }

    .logo {
        font-size: 25px;

        margin-bottom: 22px;
    }

    .ticket {
        padding: 22px 18px;

        border-radius: 20px;
    }

    .title {
        font-size: 19px;
    }

    .token {
        font-size: 34px;
    }

    .token-box {
        padding: 20px 15px;
    }

    .row {
        gap: 12px;
    }

    .label {
        font-size: 9px;
    }

    .value {
        font-size: 11px;
    }

    #qrcode {
        width: 175px;
        height: 175px;
    }
}

/* =========================================
   PRINT
========================================= */

@media print {

    body {
        background: #ffffff;

        color: #000000;

        padding: 0;
    }

    .container {
        max-width: 100%;
    }

    .logo {
        color: #000000;

        margin-top: 15px;
    }

    .ticket {
        background: #ffffff;

        color: #000000;

        border: 2px solid #000000;

        box-shadow: none;
    }

    .ticket::before {
        display: none;
    }

    .title,
    .value,
    .warning strong {
        color: #000000;
    }

    .token-box {
        background: #000000;

        color: #ffffff;
    }

    .download-btn {
        display: none;
    }
}


    </style>
</head>

<body>

    <div class="container">

        <!-- LOGO -->

        <div class="logo">
            INLIN<span>E</span>ASY
        </div>


        <!-- TICKET -->

        <div class="ticket" id="ticket">

            <h1 class="title">
                CNG BOOKING TICKET
            </h1>

            <div class="confirmed">
                ✓ BOOKING CONFIRMED
            </div>


            <!-- TOKEN -->

            <div class="token-box">

                <div class="token-label">
                    YOUR TOKEN
                </div>

                <div class="token" id="tokenNumber">
                    ---
                </div>

            </div>


            <!-- DETAILS -->

            <div class="details">

                <div class="row">
                    <span class="label">Name</span>
                    <span class="value" id="customerName">---</span>
                </div>

                <div class="row">
                    <span class="label">Mobile</span>
                    <span class="value" id="mobileNumber">---</span>
                </div>

                <div class="row">
                    <span class="label">CNG Bunk</span>
                    <span class="value" id="bunkName">---</span>
                </div>

                <div class="row">
                    <span class="label">Car</span>
                    <span class="value" id="carName">---</span>
                </div>

                <div class="row">
                    <span class="label">Car Number</span>
                    <span class="value" id="carNumber">---</span>
                </div>

                <div class="row">
                    <span class="label">Date</span>
                    <span class="value" id="bookingDate">---</span>
                </div>

                <div class="row">
                    <span class="label">Time</span>
                    <span class="value" id="bookingTime">---</span>
                </div>

            </div>


            <!-- QR -->

            <div class="qr-section">

                <h3>
                    SCAN AT CNG BUNK
                </h3>

                <div id="qrcode"></div>

                <p class="qr-note">
                    Show this QR code to the admin.
                </p>

            </div>


            <!-- WARNING -->

            <div class="warning">

                ⚠️ <strong>Please download your ticket<br>
                and keep it safe.</strong><br>

                Do not share your ticket.

            </div>


            <!-- DOWNLOAD -->

            <button
                class="download-btn"
                onclick="downloadTicket()">

                ↓ DOWNLOAD TICKET

            </button>

        </div>

    </div>

<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- PDF DOWNLOAD LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- OUR JS -->
<script src="../js/ticket.js"></script>

</body>
</html>
